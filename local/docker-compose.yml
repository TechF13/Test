name: siyasi-ofis

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    build: .
    image: siyasi-ofis-odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ../political_office:/mnt/extra-addons/political_office:ro
      - ../political_office_queue:/mnt/extra-addons/political_office_queue:ro
      - ../.addons/oca-queue/queue_job:/mnt/extra-addons/queue_job:ro
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
