[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Master password used by the database manager (/web/database/manager).
admin_passwd = admin
; queue_job runs its job runner inside the Odoo server process.
server_wide_modules = base,web,queue_job
max_cron_threads = 1

[queue_job]
channels = root:2,root.political_office:2
